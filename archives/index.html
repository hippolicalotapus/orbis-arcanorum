<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbis Arcanorum | Research Archives</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10131b;color:#f3eee3}
body{max-width:1050px;margin:auto;padding:28px 18px}h1{font-family:Georgia,serif;font-size:clamp(2rem,6vw,3.6rem);margin-bottom:6px}
p{line-height:1.6;color:#c8c9cf}.muted{font-size:.9rem;color:#b6bac5}
.controls{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}input,select{background:#202634;border:1px solid #646c7c;border-radius:8px;padding:12px;color:white;flex:1;min-width:180px;font-size:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
article{background:#1b202b;border:1px solid #38404d;border-radius:12px;padding:18px}
small{color:#d6b783}h2{font-family:Georgia,serif;font-size:1.3rem}a{color:#eacb88}a:focus-visible{outline:3px solid #fff}
</style></head><body><header><p class="muted">ORBIS ARCANORUM / RESEARCH LIBRARY</p><h1>The Archives</h1><p>Explore original institutional collections. This pilot is a source directory, not a repository of downloaded or licensed documents. Historical evidence, traditions and speculative interpretations are identified separately.</p></header>
<div class="controls"><input id="q" type="search" aria-label="Search archives" placeholder="Search titles, topics and sources"><select id="archive" aria-label="Filter by archive"><option value="">All archives</option><option value="XIII">XIII — Faith & Sacred Traditions</option><option value="XIV">XIV — Lost Histories & Civilizations</option><option value="Manuscripts">Manuscripts & Ciphers</option><option value="Cross-archive">Cross-archive</option></select></div>
<p id="count" role="status"></p><main class="grid" id="results"></main>
<script>
const records=[
{title:"Voynich Manuscript (MS 408)",source:"Yale Beinecke Library",archive:"Manuscripts",type:"Primary manuscript / institutional catalog",rights:"Link only; item rights review pending",url:"https://beinecke.library.yale.edu/beinecke/collections/beinecke-cipher-voynich-manuscript",description:"Undeciphered illustrated manuscript with herbal, astronomical and other sections."},
{title:"Voynich research finding aid (PDF)",source:"Yale University Library",archive:"Manuscripts",type:"Archival finding aid",rights:"Link only; PDF download not verified",url:"https://ead-pdfs-new.library.yale.edu/13090.pdf",description:"Finding aid for research materials and correspondence related to the manuscript."},
{title:"Smithsonian Open Access",source:"Smithsonian Institution",archive:"Cross-archive",type:"Institutional object catalog",rights:"Select individual objects marked CC0 before reuse",url:"https://www.si.edu/openaccess",description:"Searchable cultural heritage objects, including photographs, models and metadata."},
{title:"Smithsonian Libraries Books Online",source:"Smithsonian Libraries and Archives",archive:"Cross-archive",type:"Digitized books",rights:"Check each book's rights",url:"https://library.si.edu/books-online",description:"Digitized historical publications across scientific and cultural subjects."},
{title:"Discovery and Exploration",source:"Library of Congress",archive:"XIV",type:"Historical maps / primary sources",rights:"Check each item's rights advisory",url:"https://www.loc.gov/free-to-use/discovery-and-exploration/",description:"Maps and other materials documenting historical exploration."},
{title:"Early European History (1925)",source:"Library of Congress",archive:"XIV",type:"Historical textbook",rights:"Review item rights statement before rehosting",url:"https://www.loc.gov/item/25007871/",description:"Digitized historical survey; a source for studying the history of historical interpretation."},
{title:"Internet Sacred Text Archive",source:"Sacred-texts.com",archive:"XIII",type:"Transcriptions / religious traditions",rights:"Check text-specific copyright and cultural context",url:"https://sacred-texts.com/",description:"Index of religious, folklore and esoteric texts; link to original resources."},
{title:"Exploring the Art of Ancient Egypt (PDF)",source:"Smithsonian National Museum of Asian Art",archive:"XIV",type:"Museum educational resource",rights:"Link only; reuse permission not established",url:"https://asia.si.edu/wp-content/uploads/2023/04/edu-resources-Exploring-the-Art-of-Ancient-Egypt.pdf",description:"Educational material on ancient Egyptian art, belief and symbolism."}
];
const q=document.getElementById("q"),filter=document.getElementById("archive"),out=document.getElementById("results"),count=document.getElementById("count");
function render(){const needle=q.value.trim().toLowerCase();const shown=records.filter(r=>(!filter.value||r.archive===filter.value)&&Object.values(r).join(" ").toLowerCase().includes(needle));out.replaceChildren();count.textContent=shown.length+" source"+(shown.length===1?"":"s")+" found";for(const r of shown){const a=document.createElement("article");const tag=document.createElement("small");tag.textContent=r.archive+" · "+r.type;const h=document.createElement("h2");h.textContent=r.title;const p=document.createElement("p");p.textContent=r.description;const rights=document.createElement("p");rights.className="muted";rights.textContent="Rights: "+r.rights;const link=document.createElement("a");link.href=r.url;link.target="_blank";link.rel="noopener noreferrer";link.textContent="Open original source";a.append(tag,h,p,rights,link);out.append(a)}}
q.addEventListener("input",render);filter.addEventListener("change",render);render();
</script><script>
/* Research leads are clearly marked and are not downloadable documents. */
fetch("./research-leads.json").then(response=>{if(!response.ok)throw new Error("Catalog unavailable");return response.json()}).then(data=>{
 if(!Array.isArray(data.records))throw new Error("Invalid catalog");
 const categories=new Set(Array.from(filter.options).map(o=>o.value));
 for(const lead of data.records){
  if(!lead.title||!lead.source_url||!/^https:\/\//.test(lead.source_url))continue;
  records.push({title:lead.title,source:"Research lead",archive:lead.category,type:lead.classification,
  rights:"Research lead only; source item and rights not yet verified",
  url:lead.source_url,description:"Research in progress. "+lead.next_action});
  if(!categories.has(lead.category)){const option=document.createElement("option");option.value=lead.category;option.textContent=lead.category;filter.append(option);categories.add(lead.category)}
 }
 render();
}).catch(error=>{const notice=document.createElement("p");notice.setAttribute("role","alert");notice.textContent="Research leads temporarily unavailable; curated sources remain accessible.";document.querySelector("header").append(notice);});
</script>
</body></html>
