<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbis Arcanorum — Offline Editorial Queue</title>
<style>:root{color-scheme:dark}body{background:#141216;color:#f1e4d0;font:16px/1.5 system-ui,sans-serif;margin:auto;max-width:980px;padding:20px}h1,h2{color:#e4bf81}button,input,select{font:inherit;padding:9px;background:#28222b;color:#fff;border:1px solid #957b57;border-radius:5px}button{cursor:pointer}label{display:block;margin:12px 0}article{border:1px solid #65553f;padding:16px;margin:12px 0;border-radius:8px}a{color:#e4bf81;overflow-wrap:anywhere}.meta{color:#c6b6a4}#status{padding:12px;border-left:3px solid #b99a61}nav{display:flex;flex-wrap:wrap;gap:12px;align-items:center}p{overflow-wrap:anywhere}</style></head>
<body><h1>Orbis Arcanorum — Offline Editorial Queue</h1><p><strong>Private local review tool.</strong> This page never requests drafts from Supabase, never uploads a file, and cannot publish records. Open only on a trusted device. Exported draft files must be kept private.</p>
<label>Load an authorized JSON export of archive records <input id="file" type="file" accept=".json,application/json"></label><p id="status" role="status">No records loaded.</p>
<nav><label>Chamber or section <select id="section"><option value="">All sections</option></select></label><label>Review priority <select id="priority"><option value="">All</option><option value="evidence">Evidence unreviewed</option><option value="rights">Rights unverified</option><option value="translation">Translation pending</option></select></label><label>Search <input id="search" type="search" placeholder="Title or source"></label><button id="clear" type="button">Clear loaded records</button></nav>
<p id="count"></p><main id="results"></main>
<script>
"use strict";
const $=id=>document.getElementById(id);let records=[];
function textNode(parent,tag,value){const el=document.createElement(tag);el.textContent=String(value??"");parent.append(el);return el}
function cleanUrl(raw){try{const u=new URL(raw);return u.protocol==="https:"||u.protocol==="http:"?u.href:null}catch{return null}}
function render(){const section=$("section").value,priority=$("priority").value,q=$("search").value.trim().toLowerCase();const rows=records.filter(r=>(!section||r.archive_section===section)&&(!q||[r.title,r.source_name,r.archive_section].join(" ").toLowerCase().includes(q))&&(!priority||(priority==="evidence"&&r.evidence_class==="unreviewed")||(priority==="rights"&&r.rights_status==="unverified")||(priority==="translation"&&!["not_required","human_reviewed"].includes(r.translation_status))));$("results").replaceChildren();$("count").textContent=Math.min(rows.length,250)+" displayed of "+rows.length+" matching records ("+records.length+" loaded; first 250 shown)";rows.slice(0,250).forEach(r=>{const article=document.createElement("article");textNode(article,"h2",r.english_title||r.title);textNode(article,"p",r.english_description||r.description||"No description provided.");textNode(article,"p","Section: "+r.archive_section+" | Publication: "+r.publication_status+" | Evidence: "+r.evidence_class+" | Rights: "+r.rights_status+" | Translation: "+r.translation_status).className="meta";textNode(article,"p","Source: "+(r.source_name||"Unspecified"));const url=cleanUrl(r.source_url);if(url){const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener noreferrer";a.textContent="Open original source";article.append(a)}$("results").append(article)})}
$("file").addEventListener("change",async()=>{const file=$("file").files[0];if(!file)return;if(file.size>5*1024*1024){$("status").textContent="File rejected: exceeds 5 MB; previously loaded records are unchanged.";$("file").value="";return}try{const data=JSON.parse(await file.text());const items=Array.isArray(data)?data:data.records;if(!Array.isArray(items)||items.length>10000)throw Error("Expected records array of at most 10,000 entries");const next=items.map((r,i)=>{if(!r||typeof r!=="object"||typeof r.title!=="string"||typeof r.archive_section!=="string")throw Error("Invalid record "+(i+1));return Object.fromEntries(["title","english_title","description","english_description","archive_section","publication_status","evidence_class","rights_status","translation_status","source_name","source_url"].map(k=>[k,typeof r[k]==="string"?r[k].slice(0,5000):""]))});records=next;const sections=[...new Set(records.map(r=>r.archive_section))].sort();$("section").replaceChildren(new Option("All sections",""),...sections.map(s=>new Option(s,s)));$("status").textContent="Loaded "+records.length+" records into this browser tab only. No network transfer.";render()}catch(e){$("status").textContent="Import rejected: "+e.message+"; previously loaded records are unchanged."}finally{$("file").value=""}});
["section","priority","search"].forEach(id=>$(id).addEventListener("input",render));
$("clear").onclick=()=>{records=[];$("file").value="";$("section").replaceChildren(new Option("All sections",""));$("priority").value="";$("search").value="";$("status").textContent="All imported records cleared from this tab.";render()};render();
</script></body></html>
