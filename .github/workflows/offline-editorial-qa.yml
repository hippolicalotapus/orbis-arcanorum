name: Offline editorial queue browser QA
on:
  workflow_dispatch:
  push:
    branches:
      - development/offline-research-review
    paths:
      - 'prototypes/fourteen-seals/**'
      - '.github/workflows/offline-editorial-qa.yml'
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run archive taxonomy and conversion regression tests
        run: node --test prototypes/fourteen-seals/tests/chamber-mapping.test.mjs prototypes/fourteen-seals/tests/convert-archive-export.test.mjs
      - name: Install Playwright in temporary workspace
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run offline editorial queue browser tests
        run: node --test prototypes/fourteen-seals/tests/editorial-queue.test.mjs prototypes/fourteen-seals/tests/chamber-browser.test.mjs prototypes/fourteen-seals/tests/portal-navigation.test.mjs prototypes/fourteen-seals/tests/fantasy-portals.test.mjs prototypes/fourteen-seals/tests/chamber-journey.test.mjs prototypes/fourteen-seals/tests/keyboard-navigation.test.mjs
      - name: Preserve real browser screenshot for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbis-mobile-chambers-screenshot
          path: |
            test-artifacts/*.png
            test-artifacts/*.webm
          if-no-files-found: warn
          retention-days: 14

