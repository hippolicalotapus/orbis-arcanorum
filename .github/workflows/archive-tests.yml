name: Archive importer tests
on:
  push:
    paths:
      - 'tools/import_archive_jsonl.py'
      - 'tests/test_import_archive_jsonl.py'
      - '.github/workflows/archive-tests.yml'
  pull_request:
    paths:
      - 'tools/import_archive_jsonl.py'
      - 'tests/test_import_archive_jsonl.py'
      - '.github/workflows/archive-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  importer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run importer regression tests
        run: python -m unittest discover -s tests -v
