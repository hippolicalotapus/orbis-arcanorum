name: Static site smoke tests
on:
  push:
    branches: [main, feature/vendor-directory-foundation]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/site.test.cjs
